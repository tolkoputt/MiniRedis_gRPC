[project]
name = "miniredis-grpc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mikhail Osipov", email = "illuminatedbylight@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "grpcio>=1.85.1",
    "grpcio-tools>=1.85.1",
]

[project.scripts]
miniredis-grpc = "miniredis_grpc:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
exclude = [
    "*_pb2.py",
    "*_pb2_grpc.py",
]
